narrate(title,body,tone){const t=q('.iso-narr-t'),b=q('.iso-narr-b'),n=q('.iso-narr');if(t.textContent!==title)t.textContent=title;if(b.textContent!==body)b.textContent=body;if(n.dataset.tone!==tone)n.dataset.tone=tone||''},
log(id,kinds,nums){const lg=logs[id];if(!lg)return;const k=kinds.join()+'|'+(nums||[]).join();if(k===lg.key)return;lg.key=k;const h=lg.mh;q(`[data-logm="${id}"]`).innerHTML=kinds.map((kd,i)=>{const cx=lg.x0+(i+.5)*lg.c;return `<g class="iso-msg m-${kd}">${box(cx-h,cx+h,lg.y-h,lg.y+h,lg.z,lg.mz)}</g>`}).join('')+(nums||[]).map((n,i)=>`<text class="iso-onum" text-anchor="middle" transform="${GM(iso(lg.x0+(i+.5)*lg.c,lg.y+lg.c/2+lg.no,0))}">${n}</text>`).join('')},
logMarks(id,marks){const lg=logs[id];if(!lg)return;const k=JSON.stringify(marks);if(k===lg.mk)return;lg.mk=k;q(`[data-logk="${id}"]`).innerHTML=marks.map((m,i)=>{const gx=lg.x0+m.pos*lg.c,gy=lg.y+lg.c/2+.07+i*.13,a=iso(gx,gy,lg.z),b=iso(gx,gy,lg.z+(m.h||22));return `<g class="iso-mk ${m.cls}">${line(a,b)}<circle cx="${f1(b[0])}" cy="${f1(b[1])}" r="3.8"/>${m.text?`<text class="iso-mkt" x="${f1(b[0]+(m.right?6:-6))}" y="${f1(b[1]+3.5)}"${m.right?'':' text-anchor="end"'}>${esc(m.text)}</text>`:''}</g>`}).join('')},
metrics(html){const m=q('.iso-metrics');if(m.dataset.k!==html){m.dataset.k=html;m.innerHTML=html}}
};
function place(){const g=geo[openId];if(!g)return;const cw=cardEl.offsetWidth||252,ch=cardEl.offsetHeight||160,cx=(g.lf[0]+g.rt[0])/2,cl=(v,a,b)=>Math.max(a,Math.min(b,v));
// 候选位置：右 / 左 / 右下 / 左下 / 上 / 下；选与其他节点（含标签区）重叠最少的位置，自身节点权重更高
const cand=[[g.rt[0]+12,g.top[1]-14],[g.lf[0]-12-cw,g.top[1]-14],[g.rt[0]+12,g.bt[1]-ch],[g.lf[0]-12-cw,g.bt[1]-ch],[cx-cw/2,g.top[1]-44-ch],[cx-cw/2,g.bt[1]+10],[0,0],[0,H],[W,0],[W,H]].map(([x,y])=>[cl(x,8,W-cw-8),cl(y,8,H-ch-8)]);
const ovl=(x,y,r)=>Math.max(0,Math.min(x+cw,r[2])-Math.max(x,r[0]))*Math.max(0,Math.min(y+ch,r[3])-Math.max(y,r[1]));
// 评分 = 遮挡面积（自身 ×6）+ 距离 ×8：宁可远一点，也不挡住其他节点
let best=cand[0],bs=Infinity;cand.forEach(([x,y])=>{let sc=8*Math.hypot(x+cw/2-cx,y+ch/2-g.top[1]);for(const id in geo){const o=geo[id];sc+=ovl(x,y,[o.lf[0],o.top[1]-42,o.rt[0],o.bt[1]])*(id===openId?6:1)}if(sc<bs-1){bs=sc;best=[x,y]}});
cardEl.style.left=best[0]+'px';cardEl.style.top=best[1]+'px'}
function renderCard(){root.querySelectorAll('.iso-node[data-sel]').forEach(e=>{if(e.dataset.node!==openId)e.removeAttribute('data-sel')});if(openId)q(`.iso-node[data-node="${openId}"]`)?.setAttribute('data-sel','');if(!openId){cardEl.hidden=true;lastCard='';return}const c=spec.card(openId,state);if(!c)return;const pv=c.progress?Math.max(0,Math.min(1,c.progress.value)):0;
const html=`<div class="iso-card-h"><b>${esc(c.title)}</b><button type="button" class="iso-x" data-close="1" aria-label="关闭状态卡片">✕</button></div><div class="iso-st ${c.ok?'ok':'bad'}">${c.ok?'✓ Running':'✕ Down'}</div><dl>${(c.rows||[]).map(r=>`<dt>${esc(r[0])}</dt><dd>${esc(r[1])}</dd>`).join('')}</dl>${c.progress?`<div class="iso-cp"><div class="iso-cp-l"><span>${esc(c.progress.label)}</span><span>${Math.round(pv*100)}%</span></div><div class="iso-mbar"><i style="width:${f1(pv*100)}%"></i></div></div>`:''}${c.actions&&c.actions.length?`<div class="iso-card-a">${c.actions.map(a=>`<button type="button" class="iso-btn ${a.danger?'danger':'ok'}" data-act="${a.act}" data-node="${openId}">${esc(a.label)}</button>`).join('')}</div>`:''}`;
if(html===lastCard)return;lastCard=html;cardEl.innerHTML=html;cardEl.hidden=false;place()}
function closeCard(){openId=null;renderCard()}
function update(){spec.view(state,api);const tb=spec.toolbar?spec.toolbar(state):'';if(tb!==lastTb&&!dragging){const ae=document.activeElement,fa=ae&&extra.contains(ae)?ae.dataset.act:null;extra.innerHTML=tb;lastTb=tb;if(fa)extra.querySelector(`[data-act="${fa}"]`)?.focus()}renderCard()}
root.addEventListener('click',e=>{const t=e.target.closest('button');if(t&&root.contains(t)){const d=t.dataset;
if(d.hit){openId=openId===d.hit?null:d.hit;lastCard='';renderCard();return}
if(d.close){closeCard();return}
if(d.act==='__pause'){paused=!paused;t.textContent=paused?'▶ 继续':'⏸ 暂停';schedule();return}
if(d.act==='__reset'){state=spec.init(state);clearParticles();update();return}
if(d.act==='__speed'){speed=+d.v;t.parentNode.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',b===t));if(timer){clearInterval(timer);timer=null}schedule();return}
const fn=d.act&&spec.actions&&spec.actions[d.act];if(fn){const r=fn(state,api,d,t);if(r){state=r;clearParticles()}update()}return}
if(!e.target.closest('.iso-card'))closeCard()});
root.addEventListener('keydown',e=>{if(e.key==='Escape'&&openId){const id=openId;closeCard();q(`[data-hit="${id}"]`)?.focus()}});
function fit(){const w=vp.clientWidth;if(!w)return;const sc=Math.max(.7,Math.min(1,w/W));if(sc===scale)return;scale=sc;sizer.style.width=f1(W*sc)+'px';sizer.style.height=f1(H*sc)+'px';stage.style.transform=`scale(${sc})`}
const ro=window.ResizeObserver?new ResizeObserver(fit):null;ro?ro.observe(vp):fit();fit();
const io=window.IntersectionObserver?new IntersectionObserver(es=>{visible=es[es.length-1].isIntersecting;schedule()}):null;io&&io.observe(root);
const onVis=()=>schedule();document.addEventListener('visibilitychange',onVis);
let dragging=false;const onUp=()=>{if(dragging){dragging=false;update()}};root.addEventListener('pointerdown',e=>{if(e.target.type==='range')dragging=true});window.addEventListener('pointerup',onUp);
root.addEventListener('input',e=>{const t=e.target,fn=t.dataset&&t.dataset.act&&spec.actions&&spec.actions[t.dataset.act];if(fn){const r=fn(state,api,t.dataset,t);if(r){state=r;clearParticles()}update()}});
update();schedule();
return{destroy(){dead=true;if(timer)clearInterval(timer);if(raf)cancelAnimationFrame(raf);timer=raf=null;io&&io.disconnect();ro&&ro.disconnect();document.removeEventListener('visibilitychange',onVis);window.removeEventListener('pointerup',onUp);particles=[];container.innerHTML=''},get state(){return state},get timers(){return{interval:!!timer,raf:!!raf,particles:particles.length}}};
}

/* ===== 课程注册：每个 lessons/*.js 调用一次 lesson({...}) ===== */
const LESSONS=[],SCENES={},REVIEWS={};
function lesson(d){const{scenes,review,...l}=d;l.quiz=Array.isArray(d.quiz)?d.quiz:(d.question?[{question:d.question,options:d.options,answer:d.answer,explain:d.explain}]:[]);l.quiz.forEach((q,i)=>{if(!q||!q.question||!Array.isArray(q.options)||!(q.answer>=0&&q.answer<q.options.length))throw new Error(`第 ${l.n} 课第 ${i+1} 道小测试格式不对：需要 question、options、answer（从 0 开始）`)});if(LESSONS.some(x=>x.n===l.n))throw new Error('重复的课号 '+l.n);LESSONS.push(l);LESSONS.sort((a,b)=>a.n-b.n);if(scenes)SCENES[l.n]=scenes;if(review)REVIEWS[l.n]=review}
/* kv(标签, 值, 'hl'|'warn'|'') → 指标小卡片的 HTML，放进 api.metrics(`<div class="iso-kv c4">…</div>`) */
const kv=(l,v,c='')=>`<div class="${c}"><small>${l}</small><b>${v}</b></div>`;
%%LESSONS%%
const TOTAL=LESSONS.length,KEY=COURSE.storageKey,DARK_KEY=COURSE.darkKey||COURSE.storageKey+'-dark';
let saved={};try{saved=JSON.parse(localStorage.getItem(KEY)||'{}')}catch{}
let current=Math.min(TOTAL,Math.max(1,Number(location.hash.slice(1))||1));
const $=q=>document.querySelector(q),esc=x=>String(x).replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]));
function persist(){try{localStorage.setItem(KEY,JSON.stringify(saved))}catch{}}
function nav(){let s=$('#search').value.toLowerCase();$('#nav').innerHTML=LESSONS.filter(l=>(l.title+' '+l.topics+' '+l.n).toLowerCase().includes(s)).map(l=>`<button class="${l.n===current?'active':''}" data-n="${l.n}"${l.n===current?' aria-current="page"':''}><span class="num">${l.n}</span><span>${esc(l.title)} ${saved[l.n]===true?'<span class="done">✓</span>':''}</span></button>`).join('')||'<div class="sub">没有找到课程</div>';let n=Object.values(saved).filter(x=>x===true).length;$('#progressText').textContent=`${n} / ${TOTAL} 课完成`;$('#progressBar').style.width=(n/TOTAL*100)+'%';$('#navToggle').innerHTML=`<span>第 ${current} / ${TOTAL} 课 · ${esc(LESSONS[current-1].title.split('：')[0])}</span><span>${$('#aside').classList.contains('open')?'收起目录 ▴':'展开目录 ▾'}</span>`;document.querySelectorAll('#nav [data-n]').forEach(b=>b.onclick=()=>{setNav(false);go(+b.dataset.n)});}
function setNav(open){$('#aside').classList.toggle('open',open);$('#navToggle').setAttribute('aria-expanded',open);nav()}
function reviewHTML(rv){return `<div class="card rv"><h2><span class="step">04</span> 知识复盘</h2>${rv.pre||''}<div class="rv-grid${rv.terms.length===4?' c2':''}">${rv.terms.map(t=>`<div class="rv-term rv-${t.tone}"><div class="rv-h"><span class="rv-dot"></span><b>${esc(t.name)}</b><span class="rv-tag">${esc(t.tag)}</span></div><p>${esc(t.what)}</p><ul>${t.points.map(x=>`<li>${x}</li>`).join('')}</ul><div class="rv-scene">${esc(t.scene)}</div></div>`).join('')}</div>${rv.compare?`<h3 style="margin-top:20px">${esc(rv.compareTitle||'两张图对比')}</h3><div class="rv-tablewrap"><table class="rv-table${rv.comparePlain?' rv-plain':''}"><thead><tr>${rv.compare.head.map(h=>`<th>${esc(h)}</th>`).join('')}</tr></thead><tbody>${rv.compare.rows.map(r=>`<tr>${r.map((c,i)=>i?`<td>${esc(c)}</td>`:`<th>${esc(c)}</th>`).join('')}</tr>`).join('')}</tbody></table></div>`:''}${rv.extra||''}<div class="highlight"><strong>本课一句话：</strong>${esc(rv.key)}</div>${rv.quiz===false?`<div class="actions"><span class="sub">本课不设小测试，理解后手动标记完成。</span><button id="markDone" class="btn">${saved[current]===true?'✓ 已完成':'我已理解，标记完成'}</button></div>`:''}</div>`}
function render(){activeScenes.forEach(x=>x.destroy());activeScenes=[];let l=LESSONS[current-1],sc=SCENES[l.n]||{},rv=REVIEWS[l.n],noQuiz=rv&&rv.quiz===false;$('#lesson').innerHTML=`<div class="eyebrow">第 ${l.n} 课 / 共 ${TOTAL} 课 · ${COURSE.series}</div><h1>${esc(l.title)}</h1><p class="lead">${esc(l.problem)}</p><span class="topic">${esc(l.topics)}</span><div class="card"><h2><span class="step">01</span> 故障现场</h2><p>${esc(l.original)}</p>${sc.problem?'<div id="isoProblem"></div>':''}</div><div class="card"><h2><span class="step">02</span> 引入核心机制</h2><p>${esc(l.solution)}</p>${sc.solution?'<div id="isoSolution"></div>':''}</div><div class="card"><h2><span class="step">03</span> 故障模拟与处理边界</h2><p>${esc(l.failure)}</p>${rv?'':`<div class="highlight"><strong>本课一句话：</strong>${esc(l.key)}</div>`}</div>${sc.extra?`<div class="card xc"><h2><span class="step">进阶</span> ${sc.extra.title}</h2><p>${sc.extra.lead}</p><div id="isoExtra"></div><ul class="xc-pts">${sc.extra.points.map(x=>`<li>${x}</li>`).join('')}</ul><div class="highlight"><strong>一句话：</strong>${sc.extra.key}</div></div>`:''}${rv?reviewHTML(rv):''}${noQuiz||!l.quiz.length?'':`<div class="card" id="quiz"><h2><span class="step">${rv?'05':'04'}</span> ${rv?'小测试':'生产故障小测试'}${l.quiz.length>1?` <small class="qcount">共 ${l.quiz.length} 题，全部答对算完成</small>`:''}</h2>${l.quiz.map((q,qi)=>`<div class="qblock" data-q="${qi}">${l.quiz.length>1?`<p class="qno">第 ${qi+1} 题</p>`:''}<p><b>${esc(q.question)}</b></p><div class="choices">${q.options.map((o,i)=>`<label class="choice"><input type="radio" name="q${qi}" value="${i}"><span>${'ABCD'[i]}. ${esc(o)}</span></label>`).join('')}</div><div class="actions"><button class="btn qcheck"${qi?'':' id="check"'} disabled>提交答案</button><button class="btn secondary qshow"${qi?'':' id="show"'}>查看解析</button></div><div class="answer"${qi?'':' id="answer"'}></div><div class="print-ans"><b>参考答案：${'ABCD'[q.answer]}. ${esc(q.options[q.answer])}</b><p>${esc(q.explain||l.key)}</p></div></div>`).join('')}</div>`}<div class="actions"><button id="prev" class="btn secondary" ${current===1?'disabled':''}>← 上一课</button><button id="next" class="btn" ${current===TOTAL?'disabled':''}>下一课 →</button></div><div class="foot">${COURSE.footer}</div>`;solved=new Set();document.querySelectorAll('#quiz .qblock').forEach(b=>{const qi=+b.dataset.q;b.querySelectorAll('input[type=radio]').forEach(x=>x.onchange=()=>{b.querySelector('.qcheck').disabled=false});b.querySelector('.qcheck').onclick=()=>grade(false,qi);b.querySelector('.qshow').onclick=()=>grade(true,qi)});if($('#markDone'))$('#markDone').onclick=()=>{saved[current]=true;persist();$('#markDone').textContent='✓ 已完成';nav()};$('#prev').onclick=()=>go(current-1);$('#next').onclick=()=>go(current+1);if(sc.problem)activeScenes.push(createIsoScene($('#isoProblem'),sc.problem()));if(sc.solution)activeScenes.push(createIsoScene($('#isoSolution'),sc.solution()));if(sc.extra)activeScenes.push(createIsoScene($('#isoExtra'),sc.extra.scene()));nav()}
let solved=new Set();
function grade(show,qi=0){let l=LESSONS[current-1],q=l.quiz[qi],b=document.querySelector(`#quiz .qblock[data-q="${qi}"]`),sel=b.querySelector('input[type=radio]:checked'),a=b.querySelector('.answer');if(!show&&!sel)return;let good=show||Number(sel.value)===q.answer;if(!show&&good){solved.add(qi);if(solved.size===l.quiz.length){saved[current]=true;persist();nav()}}a.style.display='block';a.className='answer'+(good?'':' wrong');const left=l.quiz.length-solved.size;a.innerHTML=`<strong>${good?'✓ '+(show?'参考答案':'回答正确'):'✕ 这次不正确'}</strong><p>正确答案：${'ABCD'[q.answer]}. ${esc(q.options[q.answer])}</p><p>${esc(q.explain||l.key)}</p>${!show&&!good?'<p>你可以重新选择再提交。</p>':''}${!show&&good&&l.quiz.length>1?`<p class="sub">${left?`还有 ${left} 题没答对。`:'本课小测试全部答对，已标记完成。'}</p>`:''}`}
function go(n){if(n<1||n>TOTAL)return;current=n;history.replaceState(null,'','#'+n);render();window.scrollTo({top:0,behavior:'smooth'});const h=$('#lesson h1');if(h){h.tabIndex=-1;h.focus({preventScroll:true})}}$('#search').oninput=nav;$('#navToggle').onclick=()=>setNav(!$('#aside').classList.contains('open'));$('#theme').onclick=()=>{document.body.classList.toggle('dark');try{localStorage.setItem(DARK_KEY,document.body.classList.contains('dark'))}catch{}};try{if(localStorage.getItem(DARK_KEY)==='true')document.body.classList.add('dark')}catch{}$('#reset').onclick=()=>{if(confirm(`确定清空这 ${TOTAL} 课的答题完成记录吗？`)){saved={};persist();render()}};$('#print').onclick=()=>window.print();window.onhashchange=()=>{let n=Number(location.hash.slice(1));if(n>=1&&n<=TOTAL&&n!==current){current=n;render()}};render();
</script></body></html>
